<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Copilot de Almacén</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    margin:0;
}

.header{
    background:#003A8C;
    color:white;
    padding:20px;
    text-align:center;
    font-size:32px;
    font-weight:bold;
}

#chat{
    max-width:1200px;
    margin:auto;
    padding:20px;
    min-height:500px;
}

.user{
    background:#d9ecff;
    padding:15px;
    border-radius:15px;
    margin:10px 0;
    text-align:right;
}

.bot{
    background:white;
    padding:15px;
    border-radius:15px;
    margin:10px 0;
}

.input-area{
    position:sticky;
    bottom:0;
    background:white;
    padding:15px;
    display:flex;
    gap:10px;
    border-top:1px solid #ddd;
}

input{
    flex:1;
    padding:15px;
    font-size:18px;
    border-radius:10px;
    border:1px solid #ccc;
}

button{
    padding:15px 20px;
    border:none;
    border-radius:10px;
    background:#003A8C;
    color:white;
    cursor:pointer;
    font-size:18px;
}

button:hover{
    background:#002d6e;
}

</style>

</head>

<body>

<div class="header">
🤖 Copilot de Almacén
</div>

<div id="chat">

<div class="bot">
Hola. Puedes preguntarme:
<br><br>
• ¿Dónde está 20801?
<br>
• ¿Qué hay en SGMB?
<br>
• ¿Qué proveedores hay en SGMB?
<br>
• ¿Cuántas ubicaciones tiene KYOMX?
</div>

</div>

<div class="input-area">

<input
id="pregunta"
placeholder="Escribe tu pregunta..."
onkeydown="if(event.key==='Enter') enviarPregunta();">

<button onclick="enviarPregunta()">
🔍
</button>

<button onclick="escuchar()">
🎤
</button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyDRzY_RdNrnsraSCqJPT1Brs6nrrZPytWM3PuB7biGwOrR2RURaJoIKGjA4g_PzKUDdA/exec";

function hablar(texto){

    speechSynthesis.cancel();

    const voz =
      new SpeechSynthesisUtterance(texto);

    voz.lang = "es-MX";

    speechSynthesis.speak(voz);

}

function agregarUsuario(texto){

    document.getElementById("chat")
        .innerHTML +=
        "<div class='user'>" +
        texto +
        "</div>";

}

function agregarBot(texto){

    document.getElementById("chat")
        .innerHTML +=
        "<div class='bot'>" +
        texto +
        "</div>";

    window.scrollTo(
      0,
      document.body.scrollHeight
    );

}

function detectarIntencion(texto){

    texto = texto.toUpperCase();

    if(
       texto.includes("CUANTAS") ||
       texto.includes("CUÁNTAS")
    ){
        return "CONTEO";
    }

    if(
       texto.includes("QUE PROVEEDORES") ||
       texto.includes("QUÉ PROVEEDORES")
    ){
        return "PROVEEDORES";
    }

    if(
       texto.includes("QUE HAY") ||
       texto.includes("QUÉ HAY")
    ){
        return "RUTA";
    }

    return "DETALLE";

}

function limpiarConsulta(texto){

    let numero =
      texto.match(/\d+/);

    if(numero){

        return numero[0];

    }

    return texto
      .toUpperCase()
      .replace("DONDE ESTA","")
      .replace("DÓNDE ESTÁ","")
      .replace("QUE HAY","")
      .replace("QUÉ HAY","")
      .replace("QUE PROVEEDORES HAY","")
      .replace("QUÉ PROVEEDORES HAY","")
      .replace("CUANTAS UBICACIONES TIENE","")
      .replace("CUÁNTAS UBICACIONES TIENE","")
      .replace("PROVEEDOR","")
      .replace("?","")
      .trim();

}

async function enviarPregunta(){

    let pregunta =
      document.getElementById(
        "pregunta"
      ).value;

    if(!pregunta) return;

    document.getElementById(
      "pregunta"
    ).value = "";

    agregarUsuario(
      pregunta
    );

    let intencion =
      detectarIntencion(
        pregunta
      );

    let consulta =
      limpiarConsulta(
        pregunta
      );

    try{

      const response =
        await fetch(
          API_URL +
          "?api=1&buscar=" +
          encodeURIComponent(
            consulta
          )
        );

      const datos =
        await response.json();

      if(!datos.encontrado){

          agregarBot(
            "No encontré información."
          );

          hablar(
            "No encontré información."
          );

          return;

      }

      if(
         intencion == "PROVEEDORES"
      ){

          let proveedores =
            [...new Set(
              datos.resultados.map(
                r => r.proveedor
              )
            )];

          let html =
            proveedores.join(
              "<br>"
            );

          agregarBot(html);

          hablar(
            "Encontré " +
            proveedores.length +
            " proveedores."
          );

          return;

      }

      if(
         intencion == "CONTEO"
      ){

          let ubicaciones =
            datos.resultados.map(
              r => r.ubicacion
            );

          agregarBot(

            "Ubicaciones: " +
            ubicaciones.length +

            "<br><br>" +

            ubicaciones.join(", ")

          );

          hablar(

            "Encontré " +

            ubicaciones.length +

            " ubicaciones."

          );

          return;

      }

      let grupos = {};

      datos.resultados.forEach(function(r){

          if(!grupos[r.proveedor]){

              grupos[r.proveedor] = [];

          }

          grupos[r.proveedor]
            .push(r.ubicacion);

      });

      let html = "";

      let mensajeVoz = "";

      for(let proveedor in grupos){

          html +=

          "<b>📦 " +
          proveedor +
          "</b><br>" +

          "📍 " +

          grupos[proveedor]
            .join(", ") +

          "<br><br>";

          mensajeVoz +=

          proveedor +

          " en " +

          grupos[proveedor]
            .join(", ") +

          ". ";

      }

      agregarBot(html);

      hablar(mensajeVoz);

    }
    catch(error){

      agregarBot(
        "Error: " + error
      );

    }

}

function escuchar(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

      alert(
        "Reconocimiento no disponible"
      );

      return;

    }

    const recognition =
      new SpeechRecognition();

    recognition.lang = "es-MX";

    recognition.start();

    recognition.onresult =
      function(event){
