<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🤖 Copilot de Almacén</title>

<style>

body{
  font-family:Arial,sans-serif;
  background:#eef2f7;
  margin:0;
}

.header{
  background:#003A8C;
  color:white;
  padding:20px;
  text-align:center;
  font-size:32px;
  font-weight:bold;
}

#chat{
  max-width:1200px;
  margin:auto;
  padding:20px;
  min-height:500px;
}

.user{
  background:#d9ecff;
  padding:15px;
  border-radius:15px;
  margin:10px 0;
  text-align:right;
}

.bot{
  background:white;
  padding:15px;
  border-radius:15px;
  margin:10px 0;
}

.input-area{
  position:sticky;
  bottom:0;
  background:white;
  padding:15px;
  display:flex;
  gap:10px;
  border-top:1px solid #ddd;
}

input{
  flex:1;
  padding:15px;
  font-size:20px;
  border-radius:10px;
  border:1px solid #ccc;
}

.search-btn{
  min-width:80px;
  font-size:24px;
}

.mic-btn{
  min-width:150px;
  min-height:90px;
  font-size:48px;
  font-weight:bold;
  transition:0.3s;
}

button{
  border:none;
  border-radius:10px;
  background:#003A8C;
  color:white;
  cursor:pointer;
}

button:hover{
  background:#002d6e;
}

.mic-ready{
  background:#003A8C;
}

.mic-listening{
  background:#16a34a;
}

.mic-processing{
  background:#ea580c;
}

.escuchado{
  font-size:14px;
  color:#666;
  margin-bottom:10px;
}

.resultado{

    margin-top:15px;

    padding:20px;

    background:white;

    border-radius:15px;

    border-left:8px solid #003A8C;

    box-shadow:0 2px 8px rgba(0,0,0,.10);

    font-size:22px;

    line-height:1.5;

}

</style>

</head>

<body>

<div class="header">
🤖 Copilot de Almacén
</div>

<div id="chat">

<div class="bot">
Hola.<br><br>

Puedes preguntarme:

<br><br>

• ¿Dónde está 20801?

<br>

• ¿Qué hay en SGMB?

<br>

• ¿Qué proveedores hay en SGMB?

<br>

• ¿Cuántas ubicaciones tiene KYOMX?

</div>

</div>

<div class="input-area">

<input
id="pregunta"
placeholder="Escribe tu pregunta..."
onkeydown="if(event.key==='Enter') enviarPregunta();">

<button
class="search-btn"
onclick="enviarPregunta()">
🔍
</button>

<button
id="micBtn"
class="mic-btn mic-ready"
onclick="escuchar()">
🎤
</button>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyDRzY_RdNrnsraSCqJPT1Brs6nrrZPytWM3PuB7biGwOrR2RURaJoIKGjA4g_PzKUDdA/exec";

function textoParaVoz(texto){

  return texto

    .replaceAll("KYOMX","Kio Mex")
    .replaceAll("TKBCA","Te Ka Be Ce A")

    .replaceAll("SGMB","Ese Ge Em Be")
    .replaceAll("SGMC","Ese Ge Em Ce")

    .replaceAll("A1","A uno")
    .replaceAll("A2","A dos")
    .replaceAll("A3","A tres")
    .replaceAll("A4","A cuatro")
    .replaceAll("A5","A cinco")

    .replaceAll(
      "20801",
      "veinte mil ochocientos uno"
    );

}

function hablar(texto){

  speechSynthesis.cancel();

  texto =
    textoParaVoz(texto);

  const voz =
    new SpeechSynthesisUtterance(texto);

  voz.lang = "es-MX";

  voz.rate = 0.82;
  voz.pitch = 1;
  voz.volume = 1;

  speechSynthesis.speak(voz);

}

function agregarUsuario(texto){

  document.getElementById("chat").innerHTML +=
    "<div class='user'>" +
    texto +
    "</div>";

}

function agregarBot(texto){

  document.getElementById("chat").innerHTML +=
    "<div class='bot'>" +
    texto +
    "</div>";

  window.scrollTo(
    0,
    document.body.scrollHeight
  );

}

function detectarIntencion(texto){

  texto =
    texto.toUpperCase();

  if(
    texto.includes("CUANTAS")
    ||
    texto.includes("CUÁNTAS")
  ){
    return "CONTEO";
  }

  if(
    texto.includes("QUE PROVEEDORES")
    ||
    texto.includes("QUÉ PROVEEDORES")
  ){
    return "PROVEEDORES";
  }

  if(
    texto.includes("QUE HAY")
    ||
    texto.includes("QUÉ HAY")
  ){
    return "RUTA";
  }

  return "DETALLE";

}

function limpiarConsulta(texto){

  let numero =
    texto.match(/\d+/);

 if(numero){

    let valor = numero[0];

    if(valor.length < 5){

        agregarBot(
          "⚠️ El número detectado tiene menos de 5 dígitos. Inténtalo nuevamente."
        );

        hablar(
          "El número detectado tiene menos de cinco dígitos. Por favor repite la consulta."
        );

        return null;

    }

    return valor;

}

  return texto
    .toUpperCase()
    .replace("DONDE ESTA","")
    .replace("DÓNDE ESTÁ","")
    .replace("QUE HAY","")
    .replace("QUÉ HAY","")
    .replace("QUE PROVEEDORES HAY","")
    .replace("QUÉ PROVEEDORES HAY","")
    .replace("CUANTAS UBICACIONES TIENE","")
    .replace("CUÁNTAS UBICACIONES TIENE","")
    .replace("PROVEEDOR","")
    .replace("?","")
    .trim();

}

async function enviarPregunta(){

  let pregunta =
    document.getElementById(
      "pregunta"
    ).value;

  if(!pregunta) return;

  document.getElementById(
    "pregunta"
  ).value = "";

  agregarUsuario(
    pregunta
  );

  let intencion =
    detectarIntencion(
      pregunta
    );

  let consulta =
    limpiarConsulta(
      pregunta
    );
  if(!consulta){
    return;
}

  try{

    const response =
      await fetch(
        API_URL +
        "?api=1&buscar=" +
        encodeURIComponent(
          consulta
        )
      );

    const datos =
      await response.json();

    if(!datos.encontrado){

      agregarBot(
        "❌ No encontré información."
      );

      hablar(
        "No encontré información."
      );

      return;

    }

    if(
      intencion ===
      "PROVEEDORES"
    ){

      let proveedores =
        [...new Set(
          datos.resultados.map(
            r => r.proveedor
          )
        )];

      agregarBot(
        proveedores.join("<br>")
      );

      hablar(
        "Encontré " +
        proveedores.length +
        " proveedores."
      );

      return;

    }

    if(
      intencion ===
      "CONTEO"
    ){

      let ubicaciones =
        datos.resultados.map(
          r => r.ubicacion
        );

      agregarBot(

        "Ubicaciones: " +
        ubicaciones.length +

        "<br><br>" +

        ubicaciones.join(", ")

      );

      hablar(

        "Encontré " +

        ubicaciones.length +

        " ubicaciones."

      );

      return;

    }

   let grupos = {};

datos.resultados.forEach(function(r){

    if(!grupos[r.proveedor]){

        grupos[r.proveedor] = {

            numero:
              r.numeroProveedor,

            ruta:
              r.ruta,

            altura:
              r.alturaMaxima,

            ubicaciones: []

        };

    }

    grupos[r.proveedor]
      .ubicaciones
      .push(r.ubicacion);

});

let html = "";

let mensajeVoz = "";

for(let proveedor in grupos){

    const g =
      grupos[proveedor];

    html +=

      "<div class='resultado'>" +

      "<div><b>📦 " +
      proveedor +
      "</b></div><br>" +

      "<div>🔢 " +
      g.numero +
      "</div><br>" +

      "<div>📍 " +
      g.ubicaciones.join(", ") +
      "</div><br>" +

      "<div>🚛 " +
      g.ruta +
      "</div><br>" +

      "<div>📏 " +
      g.altura +
      "</div>" +

      "</div>";

    mensajeVoz +=

      "El proveedor " +

      proveedor +

      " número " +

      g.numero +

      " se encuentra en las ubicaciones " +

      g.ubicaciones.join(", ") +

      ". ";

}


    agregarBot(html);

    hablar(mensajeVoz);

  }
  catch(error){

    agregarBot(
      "Error: " + error
    );

  }

}

function escuchar(){

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if(!SpeechRecognition){

    alert(
      "Reconocimiento no disponible"
    );

    return;

  }

  const micBtn =
    document.getElementById(
      "micBtn"
    );

  micBtn.className =
    "mic-btn mic-listening";

  const recognition =
    new SpeechRecognition();

  recognition.lang = "es-MX";

  recognition.start();

  recognition.onresult =
    function(event){

      const texto =
        event.results[0][0]
        .transcript;
      agregarBot(
"<div class='escuchado'>🎤 Escuché:</div>" +
texto
);
      micBtn.className =
        "mic-btn mic-processing";

      document
        .getElementById(
          "pregunta"
        )
        .value =
        texto;

      enviarPregunta();

      setTimeout(function(){

        micBtn.className =
          "mic-btn mic-ready";

      },1000);

    };

  recognition.onerror =
    function(){

      micBtn.className =
        "mic-btn mic-ready";

    };

}

</script>

</body>

</html>
