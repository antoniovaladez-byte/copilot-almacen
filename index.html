<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Copilot de Almacén</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
    text-align:center;
    padding:40px;
}

h1{
    color:#003A8C;
}

button{
    padding:20px 40px;
    font-size:24px;
    border:none;
    border-radius:12px;
    background:#003A8C;
    color:white;
    cursor:pointer;
}

button:hover{
    background:#002d6e;
}

.card{
    background:white;
    padding:25px;
    border-radius:15px;
    margin-top:20px;
}

.resultado{
    text-align:left;
    margin-top:15px;
    padding:15px;
    border-bottom:1px solid #ddd;
}

</style>

</head>

<body>

<h1>🤖 Copilot de Almacén</h1>

<button onclick="escuchar()">
🎤 Hablar
</button>

<div id="respuesta" class="card">

Esperando consulta...

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyDRzY_RdNrnsraSCqJPT1Brs6nrrZPytWM3PuB7biGwOrR2RURaJoIKGjA4g_PzKUDdA/exec";

function hablar(texto){

    speechSynthesis.cancel();

    const voz =
      new SpeechSynthesisUtterance(texto);

    voz.lang = "es-MX";

    speechSynthesis.speak(voz);

}

async function consultar(valor){

    try{

        document.getElementById("respuesta")
            .innerHTML =
            "🔎 Buscando...";

        const url =
            API_URL +
            "?api=1&buscar=" +
            encodeURIComponent(valor);

        const respuesta =
            await fetch(url);

        const datos =
            await respuesta.json();

        if(!datos.encontrado){

            document
              .getElementById("respuesta")
              .innerHTML =
              "❌ No encontré información";

            hablar(
              "No encontré información"
            );

            return;

        }

        let html =
          "<h2>" +
          datos.total +
          " resultado(s) encontrado(s)</h2>";

        let mensajeVoz =
          "Encontré " +
          datos.total +
          " resultado(s). ";

        datos.resultados.forEach(function(r){

            html +=

            "<div class='resultado'>" +

            "<b>📍 Ubicación:</b> " +
            r.ubicacion +

            "<br><b>📦 Proveedor:</b> " +
            r.proveedor +

            "<br><b>🔢 Número:</b> " +
            r.numeroProveedor +

            "<br><b>🚛 Ruta:</b> " +
            r.ruta +

            "<br><b>📏 Altura:</b> " +
            r.alturaMaxima +

            "</div>";

            mensajeVoz +=

            "Ubicación " +
            r.ubicacion +

            ", proveedor " +
            r.proveedor +

            ". ";

        });

        document
          .getElementById("respuesta")
          .innerHTML =
          html;

        hablar(mensajeVoz);

    }
    catch(error){

        document
          .getElementById("respuesta")
          .innerHTML =
          "Error: " + error;

    }

}

function escuchar(){

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;

    if(!SpeechRecognition){

        alert(
          "Reconocimiento de voz no disponible"
        );

        return;

    }

    const recognition =
      new SpeechRecognition();

    recognition.lang = "es-MX";

    recognition.start();

    recognition.onresult =
      function(event){

        let texto =
          event.results[0][0]
          .transcript;

        texto =
          texto.toUpperCase();

        let consulta =
          texto;

        let numero =
          texto.match(/\d+/);

        if(numero){

            consulta =
              numero[0];

        }
        else{

            consulta =
              texto
              .replace("DONDE ESTA","")
              .replace("DÓNDE ESTÁ","")
              .replace("BUSCAR","")
              .replace("BUSCA","")
              .replace("PROVEEDOR","")
              .replace("UBICACION","")
              .replace("UBICACIÓN","")
              .replace("RUTA","")
              .replace("QUE HAY EN","")
              .replace("QUÉ HAY EN","")
              .replace("MUÉSTRAME","")
              .replace("MUESTRAME","")
              .trim();

        }

        consultar(consulta);

      };

}

</script>

</body>

</html>
