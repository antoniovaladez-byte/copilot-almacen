<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>🤖 Copilot de Almacén</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef2f7;
      margin: 0;
    }

    .header {
      background: #003A8C;
      color: white;
      padding: 20px;
      text-align: center;
      font-size: 32px;
      font-weight: bold;
    }

    #chat {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
      min-height: 500px;
    }

    .user,
    .bot {
      padding: 15px;
      border-radius: 15px;
      margin: 10px 0;
    }

    .user {
      background: #d9ecff;
      text-align: right;
    }

    .bot {
      background: white;
    }

    .input-area {
      position: sticky;
      bottom: 0;
      background: white;
      padding: 15px;
      display: flex;
      gap: 10px;
      border-top: 1px solid #ddd;
    }

    input {
      flex: 1;
      padding: 15px;
      font-size: 20px;
      border-radius: 10px;
      border: 1px solid #ccc;
    }

    button {
      border: none;
      border-radius: 10px;
      background: #003A8C;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #002d6e;
    }

    .search-btn {
      min-width: 80px;
      font-size: 24px;
    }

    .mic-btn {
      min-width: 120px;
      min-height: 70px;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
    }

    .mic-ready {
      background: #003A8C;
    }

    .mic-listening {
      background: #16a34a;
    }

    .mic-processing {
      background: #ea580c;
    }

    .escuchado {
      font-size: 14px;
      color: #666;
      margin-bottom: 10px;
    }

    .resultado {
      margin-top: 15px;
      padding: 20px;
      background: white;
      border-radius: 15px;
      border-left: 8px solid #003A8C;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .10);
      font-size: 22px;
      line-height: 1.5;
    }

    .error {
      color: #b91c1c;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="header">
    🤖 Copilot de Almacén
  </div>

  <div id="chat">
    <div class="bot">
      Hola.<br><br>

      Puedes preguntarme:<br><br>

      • ¿Dónde está 20801?<br>
      • ¿Qué hay en SGMB?<br>
      • ¿Qué proveedores hay en SGMB?<br>
      • ¿Cuántas ubicaciones tiene KYOMX?
    </div>
  </div>

  <div class="input-area">

    <input
      id="pregunta"
      type="text"
      placeholder="Escribe tu pregunta..."
      onkeydown="if(event.key === 'Enter') enviarPregunta();"
    >

    <button
      class="search-btn"
      onclick="enviarPregunta()"
      title="Buscar">
      🔎
    </button>

    <button
      id="micBtn"
      class="mic-btn mic-ready"
      onclick="escuchar()"
      title="Hablar">
      🎤
    </button>

  </div>


  <script>

    const API_URL =
      "https://script.google.com/macros/s/AKfycbyDRzY_RdNrnsraSCqJPT1Brs6nrrZPytWM3PuB7biGwOrR2RURaJoIKGjA4g_PzKUDdA/exec";


    /* =========================
       VOZ
    ========================= */

    function textoParaVoz(texto) {

      const reemplazos = {
        "KYOMX": "Kio Mex",
        "TKBCA": "Te Ka Be Ce A",

        "SGMB": "Ese Ge Em Be",
        "SGMC": "Ese Ge Em Ce",
        "SGMD": "Ese Ge Em De",
        "SGME": "Ese Ge Em E",

        "A10": "A diez",
        "A9": "A nueve",
        "A8": "A ocho",
        "A7": "A siete",
        "A6": "A seis",
        "A5": "A cinco",
        "A4": "A cuatro",
        "A3": "A tres",
        "A2": "A dos",
        "A1": "A uno"
      };

      Object.entries(reemplazos).forEach(
        ([buscar, reemplazo]) => {
          texto = texto.replaceAll(buscar, reemplazo);
        }
      );

      return texto;
    }


    function hablar(texto) {

      if (!("speechSynthesis" in window)) {
        return;
      }

      speechSynthesis.cancel();

      const voz =
        new SpeechSynthesisUtterance(
          textoParaVoz(texto)
        );

      voz.lang = "es-MX";
      voz.rate = 0.82;
      voz.pitch = 1;
      voz.volume = 1;

      speechSynthesis.speak(voz);
    }


    /* =========================
       CHAT
    ========================= */

    function agregarMensaje(texto, tipo = "bot") {

      const chat =
        document.getElementById("chat");

      const mensaje =
        document.createElement("div");

      mensaje.className = tipo;

      mensaje.innerHTML = texto;

      chat.appendChild(mensaje);

      window.scrollTo(
        0,
        document.body.scrollHeight
      );
    }


    function agregarUsuario(texto) {
      agregarMensaje(texto, "user");
    }


    function agregarBot(texto) {
      agregarMensaje(texto, "bot");
    }


    /* =========================
       INTENCIÓN
    ========================= */

    function detectarIntencion(texto) {

      const consulta =
        texto
          .toUpperCase()
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "");

      if (
        consulta.includes("CUANTAS") ||
        consulta.includes("NUMERO DE UBICACIONES")
      ) {
        return "CONTEO";
      }

      if (
        consulta.includes("QUE PROVEEDORES") ||
        consulta.includes("PROVEEDORES")
      ) {
        return "PROVEEDORES";
      }

      if (
        consulta.includes("QUE HAY")
      ) {
        return "RUTA";
      }

      return "DETALLE";
    }


    /* =========================
       LIMPIAR CONSULTA
    ========================= */

    function limpiarConsulta(texto) {

      const numeros =
        texto.match(/\d+/g);

      /*
       * Si encontramos números,
       * usamos únicamente el número.
       */
      if (numeros) {

        const valor =
          numeros.join("");

        if (valor.length !== 5) {

          const mensaje =
            valor.length < 5
              ? "⚠️ El número detectado tiene menos de 5 dígitos. Inténtalo nuevamente."
              : "⚠️ El número detectado tiene más de 5 dígitos. Inténtalo nuevamente.";

          agregarBot(mensaje);

          hablar(
            valor.length < 5
              ? "El número detectado tiene menos de cinco dígitos."
              : "El número detectado tiene más de cinco dígitos."
          );

          return null;
        }

        return valor;
      }

      /*
       * Quitamos las palabras que solamente
       * sirven para formular la pregunta.
       */
      return texto
        .toUpperCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\bDONDE ESTA\b/g, "")
        .replace(/\bQUE HAY\b/g, "")
        .replace(/\bQUE PROVEEDORES HAY\b/g, "")
        .replace(/\bCUANTAS UBICACIONES TIENE\b/g, "")
        .replace(/\bPROVEEDOR\b/g, "")
        .replace(/[?¿]/g, "")
        .trim();
    }


    /* =========================
       ENVIAR CONSULTA
    ========================= */

    async function enviarPregunta() {

      const input =
        document.getElementById("pregunta");

      const pregunta =
        input.value.trim();

      if (!pregunta) {
        return;
      }

      input.value = "";

      agregarUsuario(pregunta);

      const intencion =
        detectarIntencion(pregunta);

      const consulta =
        limpiarConsulta(pregunta);

      if (!consulta) {
        return;
      }

      try {

        const url =
          API_URL +
          "?api=1&buscar=" +
          encodeURIComponent(consulta);

        const response =
          await fetch(url, {
            method: "GET"
          });

        if (!response.ok) {
          throw new Error(
            `Error HTTP ${response.status}`
          );
        }

        const datos =
          await response.json();

        if (!datos.encontrado) {

          agregarBot(
            "❌ No encontré información."
          );

          hablar(
            "No encontré información."
          );

          return;
        }


        /* =========================
           PROVEEDORES
        ========================= */

        if (intencion === "PROVEEDORES") {

          const proveedores =
            [
              ...new Set(
                datos.resultados
                  .map(r => r.proveedor)
                  .filter(Boolean)
              )
            ];

          const html =
            proveedores
              .map(p => `📦 ${p}`)
              .join("<br>");

          agregarBot(html);

          hablar(
            `Encontré ${proveedores.length} proveedores.`
          );

          return;
        }


        /* =========================
           CONTEO
        ========================= */

        if (intencion === "CONTEO") {

          const ubicaciones =
            datos.resultados
              .map(r => r.ubicacion)
              .filter(Boolean);

          agregarBot(
            `<div class="resultado">
              <b>📍 Ubicaciones: ${ubicaciones.length}</b>
              <br><br>
              ${ubicaciones.join(", ")}
            </div>`
          );

          hablar(
            `Encontré ${ubicaciones.length} ubicaciones.`
          );

          return;
        }


        /* =========================
           DETALLE
        ========================= */

        const grupos = {};

        datos.resultados.forEach(r => {

          const proveedor =
            r.proveedor || "Sin proveedor";

          if (!grupos[proveedor]) {

            grupos[proveedor] = {
              numero: r.numeroProveedor || "",
              ruta: r.ruta || "",
              altura: r.alturaMaxima || "",
              ubicaciones: []
            };
          }

          if (r.ubicacion) {
            grupos[proveedor]
              .ubicaciones
              .push(r.ubicacion);
          }
        });


        let html =
          `<h2>✅ ${datos.total} ubicación(es) encontrada(s)</h2>`;

        let mensajeVoz = "";


        Object.entries(grupos).forEach(
          ([proveedor, grupo]) => {

            html += `
              <div class="resultado">

                <div>
                  <b>📦 ${proveedor}</b>
                </div>

                <div>
                  🔢 ${grupo.numero}
                </div>

                <div>
                  📍 ${grupo.ubicaciones.join(", ")}
                </div>

                <div>
                  🚛 ${grupo.ruta}
                </div>

                <div>
                  📏 ${grupo.altura}
                </div>

              </div>
            `;


            mensajeVoz +=
              `Encontré el proveedor ${proveedor}. ` +
              `Número ${grupo.numero}. ` +
              `Ruta ${grupo.ruta}. ` +
              `Ubicado en las posiciones ` +
              `${grupo.ubicaciones.join(", ")}. `;
          }
        );


        agregarBot(html);

        hablar(mensajeVoz);

      }

      catch (error) {

        console.error(
          "Error en la consulta:",
          error
        );

        agregarBot(
          `<div class="error">
            ❌ Ocurrió un error al consultar el almacén.
          </div>`
        );

        hablar(
          "Ocurrió un error al consultar el almacén."
        );

      }

    }


    /* =========================
       RECONOCIMIENTO DE VOZ
    ========================= */

    function escuchar() {

      const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

      if (!SpeechRecognition) {

        alert(
          "El reconocimiento de voz no está disponible en este navegador."
        );

        return;
      }

      const micBtn =
        document.getElementById("micBtn");

      const input =
        document.getElementById("pregunta");

      const recognition =
        new SpeechRecognition();

      recognition.lang = "es-MX";
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;


      micBtn.className =
        "mic-btn mic-listening";

      micBtn.textContent = "🔴";


      recognition.onresult =
        function(event) {

          const texto =
            event.results[0][0]
              .transcript
              .trim();

          agregarBot(
            `<div class="escuchado">
              🎤 Escuché:
            </div>
            ${texto}`
          );

          input.value = texto;

          micBtn.className =
            "mic-btn mic-processing";

          micBtn.textContent = "⏳";

          enviarPregunta();
        };


      recognition.onerror =
        function(event) {

          console.error(
            "Error de reconocimiento:",
            event.error
          );

          micBtn.className =
            "mic-btn mic-ready";

          micBtn.textContent = "🎤";
        };


      recognition.onend =
        function() {

          micBtn.className =
            "mic-btn mic-ready";

          micBtn.textContent = "🎤";
        };


      try {
        recognition.start();
      }
      catch (error) {

        console.error(
          "No se pudo iniciar el micrófono:",
          error
        );

        micBtn.className =
          "mic-btn mic-ready";

        micBtn.textContent = "🎤";
      }

    }

  </script>

</body>
</html>
